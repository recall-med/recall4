<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Recall admin</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('dqb_theme') || 'light');</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" />
<link rel="stylesheet" href="assets/css/styles.css" />
<link rel="stylesheet" href="assets/css/account.css" />
<style>
body { background: var(--bg); color: var(--text); font-family: var(--font-body); margin: 0; }
.ad { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
.ad-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.ad-top h1 { font: 400 1.6rem 'DM Serif Display', Georgia, serif; margin: 0; }
.ad-sub { font-size: .78rem; color: var(--text-3); }
.ad-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; }
.ad-tab { border: 1.5px solid var(--border); background: var(--surface-solid); color: var(--text-2); border-radius: 99px; padding: 6px 14px; font: 600 .82rem var(--font-body); cursor: pointer; white-space: nowrap; }
.ad-tab[aria-selected="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
.ad-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.ad-kpi, .ad-card { background: var(--surface-solid); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.ad-kpi b { display: block; font-size: 1.55rem; line-height: 1.2; }
.ad-kpi span, .ad-card h2 { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 0; }
.ad-kpi small { display: block; font-size: .72rem; color: var(--text-3); margin-top: 2px; }
.ad-card { margin-bottom: 14px; }
.ad-card h2 { margin-bottom: 8px; }
.ad-card p { font-size: .8rem; color: var(--text-3); margin: 6px 0 0; line-height: 1.5; }
.ad-scroll { overflow-x: auto; }
table.ad-t { width: 100%; border-collapse: collapse; font-size: .82rem; }
.ad-t th { text-align: left; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); padding: 4px 8px 6px 0; white-space: nowrap; }
.ad-t td { padding: 7px 8px 7px 0; border-top: 1px solid var(--border); vertical-align: top; }
.ad-t td.n, .ad-t th.n { text-align: right; font-variant-numeric: tabular-nums; }
.ad-q { max-width: 460px; }
.ad-q small { display: block; color: var(--text-3); font-size: .72rem; }
.ad-low { color: var(--text-4); }
.ad-bad { color: var(--danger); font-weight: 600; }
.ad-heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
.ad-heat i { display: block; height: 26px; border-radius: 4px; background: var(--primary); }
.ad-hl { display: flex; justify-content: space-between; font-size: .68rem; color: var(--text-3); margin-top: 4px; }
.ad-msg { padding: 28px 0; text-align: center; color: var(--text-3); font-size: .9rem; }
.ad-signin { max-width: 380px; margin: 60px auto; }
.ad-links a { color: var(--accent-text); font-weight: 600; font-size: .85rem; display: inline-block; margin: 0 14px 6px 0; }
.ad-modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.ad-modal > div { background: var(--surface-solid); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; }
.ad-modal textarea.acct-input { min-height: 70px; resize: vertical; font-family: inherit; }
.ad-ok { color: var(--success); font-weight: 600; font-size: .85rem; }
.ad-act { background: none; border: 0; padding: 0; font: 600 .78rem var(--font-body); cursor: pointer; color: var(--accent-text); }
.ad-act.warn { color: var(--danger); }
.ad-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.ad-filters select.acct-input, .ad-filters input.acct-input { flex: 1 1 150px; min-width: 0; }
.ad-topic > summary, details.ad-card > summary { cursor: pointer; font-size: .9rem; }
.ad-tlinks { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.ad-tlinks a { color: var(--accent-text); font-weight: 600; font-size: .8rem; }
.ad-bar { height: 8px; border-radius: 4px; background: var(--primary); display: inline-block; vertical-align: middle; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="ad" id="root"><div class="ad-msg">Loading…</div></div>
<script>
window.Sync = { attachAuth: function (p) { window.__prov = p; p.onChange(function (u) { window.__onUser && window.__onUser(u); }); } };
</script>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n == null ? '–' : Number(n).toLocaleString('en-US'));
const pct = (a, b) => (b ? Math.round((a / b) * 100) : null);
const root = $('root');
let data = null, tab = 'overview', loading = false;
const questionFiles = {}; // path -> Promise of { id: question }

// ---- sign-in (reuses the app's Firebase module) ----
window.__onUser = (u) => { if (u) load(false); else showSignin(); };
function showSignin(msg) {
  root.innerHTML = '<div class="ad-card ad-signin"><h2>Recall admin</h2><p style="margin:0 0 12px">Sign in with the administrator account.</p>' +
    '<button class="btn btn--ghost acct-google" id="g" type="button" style="width:100%;justify-content:center">Continue with Google</button>' +
    '<div class="acct-or"><span>or</span></div><form id="f"><label class="acct-field"><span>Email</span><input class="acct-input" name="e" type="email" autocomplete="email" required></label>' +
    '<label class="acct-field"><span>Password</span><input class="acct-input" name="p" type="password" autocomplete="current-password" required></label>' +
    '<p class="acct-error" id="err">' + esc(msg || '') + '</p><button class="btn btn--primary acct-submit" type="submit">Sign in</button></form></div>';
  const fail = (e) => { $('err').textContent = e && e.code === 'auth/popup-closed-by-user' ? 'Sign-in was cancelled.' : 'Could not sign in. Check the details and try again.'; };
  $('g').onclick = () => window.__prov.signInGoogle().catch(fail);
  $('f').onsubmit = (ev) => { ev.preventDefault(); window.__prov.signInEmail(ev.target.e.value.trim(), ev.target.p.value).catch(fail); };
}
import('./assets/js/auth.js').catch(() => { root.innerHTML = '<div class="ad-msg">Sign-in could not load. Check your connection and reload.</div>'; });

// ---- data ----
async function load(refresh) {
  if (loading) return; loading = true;
  try {
    const call = async (force) => {
      const t = await window.__prov.getToken(force);
      return fetch('/api/admin/summary' + (refresh ? '?refresh=1' : ''), { headers: { Authorization: 'Bearer ' + t } });
    };
    let res = await call(false);
    if (res.status === 401) res = await call(true);
    const j = await res.json().catch(() => null);
    if (res.status === 403) { root.innerHTML = '<div class="ad-msg">This account is not an administrator.<br><button class="btn btn--ghost" id="so" style="margin-top:12px">Sign out</button></div>'; $('so').onclick = () => window.__prov.signOut(); return; }
    if (!j || !j.ok) throw new Error('bad');
    data = j; render();
  } catch (e) {
    root.innerHTML = '<div class="ad-msg">Could not load the dashboard. Check your connection.<br><button class="btn btn--ghost" id="rt" style="margin-top:12px">Try again</button></div>';
    $('rt').onclick = () => load(true);
  } finally { loading = false; }
}
async function adminFetch(url, opts) {
  const call = async (force) => fetch(url, { ...(opts || {}), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (await window.__prov.getToken(force)) } });
  let res = await call(false); if (res.status === 401) res = await call(true);
  return { status: res.status, body: await res.json().catch(() => ({})) };
}
const REPO = 'recall-med/recall4';
const letter = (i) => String.fromCharCode(65 + i);
const keyOf = (t, q) => [t.module, t.exam, t.subject, t.sub, q.id].join('|');
let bank = null;
const qf = { module: '', exam: '', subject: '', q: '' }, openTopics = new Set();
// Every question, read from the same public data files the app uses (listed by config/modules.json).
async function loadBank(force) {
  if (bank && !force) return bank;
  const cfg = await fetch('config/modules.json').then((r) => r.json());
  const lab = (arr, id) => ((arr || []).find((x) => x.id === id) || {}).label || id;
  const topics = [];
  (cfg.modules || []).forEach((m) => Object.entries(m.subSubjects || {}).forEach(([exam, subs]) => Object.entries(subs).forEach(([subject, list]) => (list || []).forEach((ss) => topics.push({
    module: m.id, moduleTitle: m.shortTitle || m.title || m.id, exam, examLabel: lab(cfg.examTypes, exam), subject, subjectLabel: lab(cfg.subjects, subject),
    sub: ss.id, label: ss.label || ss.id, path: 'data/' + (m.dataPath || m.id) + '/' + exam + '/' + subject + '/' + ss.id + '.json', questions: [], exists: false })))));
  await Promise.all(topics.map((t) => fetch(t.path + '?v=' + Date.now()).then((r) => (r.ok ? r.json() : null)).catch(() => null).then((d) => {
    if (d) { t.exists = true; t.questions = Array.isArray(d) ? d : d.questions || []; }
  })));
  bank = { cfg, topics: topics.filter((t) => t.exists) };
  return bank;
}
function byKey(key) {
  for (const t of bank.topics) { const q = t.questions.find((x) => keyOf(t, x) === key); if (q) return { t, q }; }
  return null;
}

// ---- views ----
function kpi(label, value, sub) { return '<div class="ad-kpi"><span>' + label + '</span><b>' + value + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>'; }
function overview() {
  const d = data, days = [];
  for (let i = 29; i >= 0; i--) { const t = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); const r = d.examsPerDay.find((x) => x.day === t); days.push({ t, n: r ? r.exams : 0 }); }
  const max = Math.max(1, ...days.map((x) => x.n));
  const bars = days.map((x, i) => '<rect x="' + (i * 20 + 2) + '" y="' + (80 - (x.n / max) * 76) + '" width="16" height="' + Math.max(1, (x.n / max) * 76) + '" rx="3" fill="var(--primary-light)"><title>' + x.t + ': ' + x.n + ' exams</title></rect>').join('');
  const cairoH = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', hour: '2-digit', hour12: false }).format(new Date())) % 24;
  const off = (cairoH - new Date().getUTCHours() + 24) % 24, hrs = Array(24).fill(0);
  d.examsPerHourUtc.forEach((r) => { hrs[(r.h + off) % 24] += r.n; });
  const hmax = Math.max(1, ...hrs);
  const heat = hrs.map((n, h) => '<i title="' + h + ':00 Cairo: ' + n + ' exams" style="opacity:' + (0.08 + 0.92 * (n / hmax)).toFixed(2) + '"></i>').join('');
  const att = d.accuracy.reduce((s, r) => s + (r.attempted || 0), 0), cor = d.accuracy.reduce((s, r) => s + (r.correct || 0), 0);
  const mods = d.examsPerModule.map((m) => '<tr><td>' + esc(m.module) + '</td><td class="n">' + fmt(m.exams) + '</td><td><span class="ad-bar" style="width:' + Math.round((m.exams / d.examsPerModule[0].exams) * 100) + 'px"></span></td></tr>').join('');
  const subs = d.accuracy.map((r) => '<tr><td>' + esc(r.module) + ' / ' + esc(r.subject || 'whole module') + '</td><td class="n">' + fmt(r.exams) + '</td><td class="n">' + fmt(r.attempted) + '</td><td class="n' + (r.accuracyPct != null && r.accuracyPct < 50 ? ' ad-bad' : '') + '">' + (r.accuracyPct == null ? '–' : r.accuracyPct + '%') + '</td></tr>').join('');
  return '<div class="ad-grid">' + kpi('Accounts', fmt(d.accounts), fmt(d.newWeek) + ' new in 7 days · ' + fmt(d.newToday) + ' today') +
    kpi('Studying today', fmt(d.studyingToday), 'finished an exam · 7 days: ' + fmt(d.studyingWeek)) +
    kpi('Studying (30 days)', fmt(d.studyingMonth), 'stickiness ' + (pct(d.studyingToday, d.studyingMonth) ?? '–') + '% (today ÷ 30 days)') +
    kpi('Exams (30 days)', fmt(d.examsTotal), 'average ' + Math.round((d.avgTimeSec || 0) / 60) + ' min each') +
    kpi('Accuracy (30 days)', att ? pct(cor, att) + '%' : '–', fmt(att) + ' answers') + '</div>' +
    '<div class="ad-card"><h2>Exams per day (UTC dates)</h2><svg viewBox="0 0 600 84" width="100%" role="img" aria-label="Exams per day">' + bars + '</svg></div>' +
    '<div class="ad-card"><h2>When students study (Cairo time, 30 days)</h2><div class="ad-heat">' + heat + '</div><div class="ad-hl"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div><p>Darker is busier. Cloudflare daily limits reset at 00:00 UTC.</p></div>' +
    '<div class="ad-card ad-scroll"><h2>Exams by module (30 days)</h2><table class="ad-t"><tbody>' + (mods || '<tr><td class="ad-low">No exams yet.</td></tr>') + '</tbody></table></div>' +
    '<div class="ad-card ad-scroll"><h2>Accuracy by subject (30 days)</h2><table class="ad-t"><thead><tr><th>Subject</th><th class="n">Exams</th><th class="n">Answers</th><th class="n">Correct</th></tr></thead><tbody>' + (subs || '<tr><td class="ad-low" colspan="4">No exams yet.</td></tr>') + '</tbody></table></div>';
}
function qline(t, q, extra) {
  return '<div class="ad-q">' + esc(String(q.question).slice(0, 150)) + (q.question.length > 150 ? '…' : '') + '<small>' + esc(t.moduleTitle + ' › ' + t.subjectLabel + ' › ' + t.label) + ' · #' + esc(q.id) + (extra || '') + '</small></div>';
}
const actBtns = (t, q) => '<button class="ad-act" data-act="edit" data-key="' + esc(keyOf(t, q)) + '">Edit</button> <button class="ad-act warn" data-act="del" data-key="' + esc(keyOf(t, q)) + '">Remove</button>';
let statsOf = () => ({}), savedOf = () => 0;
function groupsHtml() {
  const term = qf.q.trim().toLowerCase();
  const match = (q) => !term || (q.question + ' ' + q.options.join(' ') + ' #' + q.id).toLowerCase().includes(term);
  let total = 0, shown = 0;
  const html = bank.topics.filter((t) => (!qf.module || t.module === qf.module) && (!qf.exam || t.exam === qf.exam) && (!qf.subject || t.subject === qf.subject)).map((t) => {
    const qs = t.questions.filter(match); total += t.questions.length; shown += qs.length;
    if (term && !qs.length) return '';
    const rows = qs.map((q) => { const s = statsOf(t, q), sv = savedOf(t, q);
      return '<tr><td class="n">' + esc(q.id) + '</td><td>' + qline(t, q).replace(/<small>.*<\/small>/, '') + '</td><td class="n">' + letter(q.answer) + '</td><td class="n' + (s && s.n >= 20 && s.pct < 40 ? ' ad-bad' : '') + '">' + (s ? s.pct + '% · ' + s.n : '<span class="ad-low">–</span>') + '</td><td class="n">' + (sv || '<span class="ad-low">–</span>') + '</td><td style="white-space:nowrap">' + actBtns(t, q) + '</td></tr>'; }).join('');
    return '<details class="ad-card ad-topic" data-tp="' + esc(t.path) + '"' + (term || openTopics.has(t.path) ? ' open' : '') + '><summary><b>' + esc(t.moduleTitle) + ' › ' + esc(t.examLabel) + ' › ' + esc(t.subjectLabel) + ' › ' + esc(t.label) + '</b> <span class="ad-sub">' + t.questions.length + ' questions</span></summary>' +
      '<div class="ad-scroll"><table class="ad-t"><thead><tr><th class="n">#</th><th>Question</th><th class="n">Key</th><th class="n">Correct · answers</th><th class="n">Saved by</th><th></th></tr></thead><tbody>' + (rows || '<tr><td class="ad-low" colspan="6">No questions.</td></tr>') + '</tbody></table></div>' +
      '<div class="ad-tlinks"><button class="ad-act" data-add="' + esc(t.path) + '">+ Add a question</button><a href="https://github.com/' + REPO + '/blob/main/' + esc(t.path) + '" target="_blank" rel="noopener">Open file on GitHub</a></div></details>';
  }).join('');
  return '<p class="ad-sub" style="margin:0 0 10px">' + (term || qf.module || qf.exam || qf.subject ? shown + ' of ' + total + ' questions match' : total + ' questions in ' + bank.topics.length + ' topics') + '</p>' + (html || '<div class="ad-msg">Nothing matches.</div>');
}
function refreshList() { if ($('qlist')) $('qlist').innerHTML = groupsHtml(); }
function flash(msg, bad) { const el = $('qmsg'); if (el) { el.className = bad ? 'acct-error' : 'ad-ok'; el.style.display = 'block'; el.textContent = msg; } }
async function questions() {
  try { await loadBank(); } catch (e) { return '<div class="ad-msg">Could not load the question files.</div>'; }
  const itemsBy = Object.fromEntries((data.items || []).map((i) => [i.key, i])), savedBy = Object.fromEntries((data.saved || []).map((s) => [s.qk, s.students]));
  statsOf = (t, q) => {
    const it = itemsBy[keyOf(t, q)]; if (!it) return null;
    const c = Object.entries(it.counts).filter(([a]) => Number(a) >= 0), n = c.reduce((s, [, x]) => s + x, 0); if (!n) return null;
    const top = c.slice().sort((x, y) => y[1] - x[1])[0];
    return { n, pct: pct(it.counts[q.answer] || 0, n), topOpt: Number(top[0]), topPct: pct(top[1], n) };
  };
  savedOf = (t, q) => savedBy[keyOf(t, q)] || 0;
  const all = []; bank.topics.forEach((t) => t.questions.forEach((q) => { const s = statsOf(t, q); if (s) all.push({ t, q, s }); }));
  const MIN = 20, ok = all.filter((x) => x.s.n >= MIN);
  const wrong = ok.filter((x) => x.s.topOpt !== x.q.answer && x.s.topPct >= 50 && x.s.pct < 25);
  const hard = ok.slice().sort((a, b) => a.s.pct - b.s.pct).slice(0, 10);
  const mostSaved = (data.saved || []).slice(0, 10).map((s) => ({ f: byKey(s.qk), n: s.students })).filter((x) => x.f);
  const tbl = (head, rows, empty) => '<div class="ad-scroll"><table class="ad-t"><thead><tr>' + head + '</tr></thead><tbody>' + (rows || '<tr><td class="ad-low" colspan="4">' + empty + '</td></tr>') + '</tbody></table></div>';
  const ins = '<details class="ad-card"><summary><b>Statistics worth a look</b> <span class="ad-sub">from students\u2019 exam answers</span></summary>' +
    '<h2 style="margin:12px 0 6px">Possible wrong answer key</h2>' + tbl('<th>Question</th><th class="n">Key</th><th class="n">Most chosen</th><th class="n">n</th>',
      wrong.map((x) => '<tr><td>' + qline(x.t, x.q, ' · ' + actBtns(x.t, x.q)) + '</td><td class="n">' + letter(x.q.answer) + ' (' + x.s.pct + '%)</td><td class="n ad-bad">' + letter(x.s.topOpt) + ' (' + x.s.topPct + '%)</td><td class="n">' + x.s.n + '</td></tr>').join(''), 'None found.') +
    '<p>Most students picked one other option and few picked the key. This is an inference: check the question before changing it.</p>' +
    '<h2 style="margin:12px 0 6px">Hardest questions</h2>' + tbl('<th>Question</th><th class="n">Correct</th><th class="n">Most chosen</th><th class="n">n</th>',
      hard.map((x) => '<tr><td>' + qline(x.t, x.q, ' · ' + actBtns(x.t, x.q)) + '</td><td class="n">' + x.s.pct + '%</td><td class="n">' + letter(x.s.topOpt) + ' (' + x.s.topPct + '%)</td><td class="n">' + x.s.n + '</td></tr>').join(''), 'Needs at least ' + MIN + ' answers per question.') +
    '<h2 style="margin:12px 0 6px">Saved by the most students</h2>' + tbl('<th>Question</th><th class="n">Saved by</th>',
      mostSaved.map((x) => '<tr><td>' + qline(x.f.t, x.f.q, ' · ' + actBtns(x.f.t, x.f.q)) + '</td><td class="n">' + x.n + '</td></tr>').join(''), 'Nothing saved yet.') +
    '<p>Saving is a student\u2019s own "review this later" list, not a report. A high count shows what students find tricky or worth revisiting. Answer statistics cover the last 90 days, only questions answered at least ' + MIN + ' times, and exams with a stored review.</p></details>';
  const opt = (v, l, cur) => '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>';
  const uniq = (f) => { const m = new Map(); bank.topics.forEach((t) => m.set(...f(t))); return [...m]; };
  return '<p id="qmsg" role="status" style="display:none"></p>' + ins +
    '<div class="ad-card"><div class="ad-filters"><select class="acct-input" id="qm" aria-label="Module">' + opt('', 'All modules', qf.module) + uniq((t) => [t.module, t.moduleTitle]).map(([v, l]) => opt(v, l, qf.module)).join('') + '</select>' +
    '<select class="acct-input" id="qe" aria-label="Exam type">' + opt('', 'All exam types', qf.exam) + uniq((t) => [t.exam, t.examLabel]).map(([v, l]) => opt(v, l, qf.exam)).join('') + '</select>' +
    '<select class="acct-input" id="qs" aria-label="Subject">' + opt('', 'All subjects', qf.subject) + uniq((t) => [t.subject, t.subjectLabel]).map(([v, l]) => opt(v, l, qf.subject)).join('') + '</select>' +
    '<input class="acct-input" id="qq" type="search" placeholder="Search question text, options or number" value="' + esc(qf.q) + '" aria-label="Search questions"></div></div><div id="qlist">' + groupsHtml() + '</div>';
}
function retention() {
  const a = data.activation, cr = data.cohorts.map((c) => '<tr><td>' + new Date(c.weekStart).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + '</td><td class="n">' + c.size + '</td>' +
    c.retained.map((n) => '<td class="n' + (n == null ? ' ad-low' : '') + '">' + (n == null ? '–' : n + ' (' + pct(n, c.size) + '%)') + '</td>').join('') + '</tr>').join('');
  return '<div class="ad-grid">' + kpi('Studied at least once', pct(a.ever, a.signups) == null ? '–' : pct(a.ever, a.signups) + '%', 'of ' + a.signups + ' signups, last 8 weeks') +
    kpi('First exam within 24 h', pct(a.within24h, a.eligible24h) == null ? '–' : pct(a.within24h, a.eligible24h) + '%', 'of signups older than a day') +
    kpi('First exam within 7 days', pct(a.within7d, a.eligible7d) == null ? '–' : pct(a.within7d, a.eligible7d) + '%', 'of signups older than a week') +
    kpi('Median time to first exam', a.medianHours == null ? '–' : a.medianHours + ' h', 'after signing up') + '</div>' +
    '<div class="ad-card ad-scroll"><h2>Weekly signup cohorts: studied again in week…</h2><table class="ad-t"><thead><tr><th>Week of</th><th class="n">Signed up</th><th class="n">Week 0</th><th class="n">Week 1</th><th class="n">Week 2</th><th class="n">Week 3</th></tr></thead><tbody>' +
    (cr || '<tr><td class="ad-low" colspan="6">No signups in the last 8 weeks.</td></tr>') + '</tbody></table><p>"Studied" means finished at least one exam that week. Weeks run Thursday to Wednesday (UTC). With few students, treat single percentages loosely.</p></div>';
}
function system() {
  const t = data.totals, next = new Date(); next.setUTCHours(24, 0, 0, 0);
  const hrs = Math.round((next - Date.now()) / 36e5 * 10) / 10;
  return '<div class="ad-grid">' + kpi('Users', fmt(t.users)) + kpi('Exams stored', fmt(t.attempts)) + kpi('Topic rows', fmt(t.scopes)) + kpi('Daily limits reset in', hrs + ' h', '00:00 UTC') + '</div>' +
    '<div class="ad-card ad-links"><h2>Live usage (needs your Cloudflare and Firebase login)</h2>' +
    '<a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare: Workers &amp; Pages, Usage</a><a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare: D1, Metrics</a>' +
    '<a href="https://console.firebase.google.com/project/recall-med/authentication/users" target="_blank" rel="noopener">Firebase: Authentication</a>' +
    '<p>Request counts and database reads and writes are not available here, because reading them would need an extra secret. Editing questions uses a GitHub token stored only as an encrypted Cloudflare variable. Free-plan reminders: 60 exam uploads per hour per account; D1 allows 100,000 row writes per day.</p></div>';
}
const day = (t) => (t ? new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' }) : '–');
let studentList = [], meOwner = false;
const studentRows = (list, f) => {
  f = String(f || '').trim().toLowerCase();
  return list.filter((s) => !f || [s.email, s.first_name, s.last_name, s.uid].join(' ').toLowerCase().includes(f)).map((s) => {
    const role = s.owner ? '<b>Owner</b> ' : s.is_admin ? '<b>Admin</b> ' : '';
    const acts = [];
    if (s.blocked) acts.push('<span class="ad-bad">Removed</span> <button class="ad-act" data-ub="' + esc(s.uid) + '">Unblock</button>');
    else if (!s.owner && !s.is_admin) acts.push('<button class="ad-act warn" data-rm="' + esc(s.uid) + '">Remove</button>');
    if (meOwner && !s.owner && !s.blocked) acts.push(s.is_admin ? '<button class="ad-act warn" data-rma="' + esc(s.uid) + '">Remove admin</button>' : '<button class="ad-act" data-mk="' + esc(s.uid) + '">Make admin</button>');
    return '<tr><td>' + (esc([s.first_name, s.last_name].filter(Boolean).join(' ')) || '<span class="ad-low">no name</span>') + '<small style="display:block;color:var(--text-3);font-size:.72rem">' + esc(s.uid) + '</small></td>' +
      '<td>' + (s.email ? esc(s.email) : '<span class="ad-low">not yet on file</span>') + '</td><td>' + day(s.created_at) + '</td><td>' + day(s.last_exam) + '</td>' +
      '<td class="n">' + s.exams + '</td><td class="n">' + (s.attempted ? Math.round((s.correct / s.attempted) * 100) + '%' : '–') + '</td><td>' + role + acts.join(' ') + '</td></tr>';
  }).join('');
};
async function students() {
  const r = await adminFetch('/api/admin/students');
  if (r.status !== 200 || !r.body.ok) return '<div class="ad-msg">Could not load the student list.</div>';
  studentList = r.body.students; meOwner = !!(r.body.me && r.body.me.owner);
  return '<div class="ad-card"><input class="acct-input" id="sq" type="search" placeholder="Search name, email or id" aria-label="Search students"><p>' + studentList.length + ' accounts. Emails appear once a person has signed in after the email update.' + (meOwner ? '' : ' Only an owner can make or remove admins.') + '</p></div>' +
    '<div class="ad-card ad-scroll"><table class="ad-t"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last exam</th><th class="n">Exams</th><th class="n">Correct</th><th>Role / actions</th></tr></thead><tbody id="sb">' + studentRows(studentList, '') + '</tbody></table>' +
    '<p>Admins can open this page, see student emails, and edit or remove questions. Remove deletes a student\u2019s cloud data and blocks the account from syncing; their login stays in Firebase until you delete it there. To remove an admin account, first remove its admin rights.</p></div>';
}
const TABS = { overview: ['Overview', overview], questions: ['Questions', questions], students: ['Students', students], retention: ['Retention', retention], system: ['System', system] };
function modal(html) { closeModal(); const m = document.createElement('div'); m.className = 'ad-modal'; m.id = 'edm'; m.innerHTML = '<div role="dialog" aria-modal="true">' + html + '</div>'; m.addEventListener('click', (e) => { if (e.target === m) closeModal(); }); document.body.appendChild(m); return m; }
function closeModal() { const m = $('edm'); if (m) m.remove(); }
const enc = encodeURIComponent;
async function openEditor(key, addPath) {
  const found = key ? byKey(key) : null, t = found ? found.t : bank.topics.find((x) => x.path === addPath);
  const m = modal('<p class="ad-sub">Loading…</p>');
  const fail = (msg) => { m.firstChild.innerHTML = '<h2 style="margin:0 0 10px;font-size:1.1rem">Question</h2><p class="acct-error" style="display:block">' + esc(msg) + '</p><button class="btn btn--ghost" type="button" id="edx">Close</button>'; $('edx').onclick = closeModal; };
  const r = await adminFetch('/api/admin/question?path=' + enc(t.path) + (found ? '&id=' + enc(found.q.id) : ''));
  if (r.status !== 200 || !r.body.ok) return fail(r.body.message || 'Could not open the question.');
  let sha = r.body.sha;
  const q = found ? r.body.question : { question: '', options: ['', '', '', ''], answer: 0, explanation: '' };
  m.firstChild.innerHTML = '<h2 style="margin:0 0 4px;font-size:1.1rem">' + (found ? 'Edit question #' + esc(q.id) : 'Add a question') + '</h2><div class="ad-sub" style="margin-bottom:10px">' + esc(t.moduleTitle + ' › ' + t.subjectLabel + ' › ' + t.label) + '</div><form id="edf">' +
    '<label class="acct-field"><span>Question</span><textarea class="acct-input" name="question">' + esc(q.question) + '</textarea></label>' +
    q.options.map((o, i) => '<label class="acct-field"><span>Option ' + letter(i) + '</span><input class="acct-input" name="o' + i + '" value="' + esc(o) + '"></label>').join('') +
    '<label class="acct-field"><span>Correct answer</span><select class="acct-input" name="answer">' + q.options.map((_, i) => '<option value="' + i + '"' + (i === q.answer ? ' selected' : '') + '>' + letter(i) + '</option>').join('') + '</select></label>' +
    '<label class="acct-field"><span>Explanation (optional)</span><textarea class="acct-input" name="explanation">' + esc(q.explanation || '') + '</textarea></label>' +
    '<p class="acct-error" id="ederr" role="alert"></p><p class="ad-ok" id="edok" hidden>Saved to GitHub. The site updates in about a minute.</p>' +
    '<div class="acct-actions acct-actions--row"><button class="btn btn--ghost" type="button" id="edx">Close</button><button class="btn btn--primary" type="submit" id="eds">' + (found ? 'Save to GitHub' : 'Add to GitHub') + '</button></div></form>';
  $('edx').onclick = closeModal;
  $('edf').onsubmit = async (ev) => {
    ev.preventDefault(); const f = ev.target.elements; $('ederr').textContent = ''; $('eds').disabled = true;
    const fields = { question: f.question.value, options: q.options.map((_, i) => f['o' + i].value), answer: Number(f.answer.value), explanation: f.explanation.value };
    const s = await adminFetch('/api/admin/question', { method: 'POST', body: JSON.stringify(found ? { path: t.path, id: q.id, sha, ...fields } : { action: 'add', path: t.path, sha, ...fields }) });
    if (s.status === 200 && s.body.ok) {
      $('edok').hidden = false; sha = s.body.sha || sha;
      if (found) { Object.assign(found.q, fields); $('eds').disabled = false; } else { t.questions.push({ id: s.body.id, ...fields }); $('edx').textContent = 'Close'; }
      refreshList(); return;
    }
    $('ederr').textContent = s.body.message || 'Could not save.'; $('eds').disabled = false;
  };
}
async function removeQuestion(key) {
  const f = byKey(key); if (!f) return;
  if (!confirm('Remove question #' + f.q.id + ' from ' + f.t.label + '?\n\n"' + String(f.q.question).slice(0, 160) + '"\n\nThis commits the removal to GitHub. The other questions keep their numbers. Copies students already saved on their own devices are not touched.')) return;
  const r = await adminFetch('/api/admin/question?path=' + enc(f.t.path) + '&id=' + enc(f.q.id));
  if (r.status !== 200 || !r.body.ok) return flash(r.body.message || 'Could not open the question.', true);
  const s = await adminFetch('/api/admin/question', { method: 'POST', body: JSON.stringify({ action: 'delete', path: f.t.path, id: f.q.id, sha: r.body.sha }) });
  if (s.status !== 200 || !s.body.ok) return flash(s.body.message || 'Could not remove it.', true);
  f.t.questions = f.t.questions.filter((x) => x !== f.q); refreshList(); flash('Removed question #' + f.q.id + '. The site updates in about a minute.');
}
root.addEventListener('input', (e) => {
  if (e.target.id === 'sq' && $('sb')) $('sb').innerHTML = studentRows(studentList, e.target.value);
  if (e.target.id === 'qq') { qf.q = e.target.value; refreshList(); }
});
root.addEventListener('change', (e) => {
  const k = { qm: 'module', qe: 'exam', qs: 'subject' }[e.target.id]; if (k) { qf[k] = e.target.value; refreshList(); }
});
root.addEventListener('toggle', (e) => { const p = e.target && e.target.dataset && e.target.dataset.tp; if (p) { if (e.target.open) openTopics.add(p); else openTopics.delete(p); } }, true);
root.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act],[data-add],[data-rm],[data-ub],[data-mk],[data-rma]'); if (!t) return;
  if (t.dataset.act === 'edit') return openEditor(t.dataset.key);
  if (t.dataset.act === 'del') return removeQuestion(t.dataset.key);
  if (t.dataset.add) return openEditor(null, t.dataset.add);
  const uid = t.dataset.rm || t.dataset.ub || t.dataset.mk || t.dataset.rma, s = studentList.find((x) => x.uid === uid);
  const action = t.dataset.rm ? 'remove' : t.dataset.ub ? 'unblock' : t.dataset.mk ? 'make_admin' : 'remove_admin';
  const who = (s && (s.email || [s.first_name, s.last_name].filter(Boolean).join(' '))) || uid;
  if (action === 'remove' && !confirm('Remove ' + who + '?\n\nTheir cloud progress is deleted and the account is blocked from syncing. Their Firebase login stays until you delete it there.')) return;
  if (action === 'make_admin' && !confirm('Make ' + who + ' an admin?\n\nAdmins can open this page, see every student\u2019s email, and edit or remove questions.')) return;
  if (action === 'remove_admin' && !confirm('Remove admin rights from ' + who + '?')) return;
  const r = await adminFetch('/api/admin/student', { method: 'POST', body: JSON.stringify({ uid, action }) });
  if (r.status !== 200) { alert(r.body.message || 'That did not work.'); return; }
  render();
});
async function render() {
  const tabs = Object.entries(TABS).map(([k, v]) => '<button class="ad-tab" role="tab" data-t="' + k + '" aria-selected="' + (k === tab) + '">' + v[0] + '</button>').join('');
  root.innerHTML = '<div class="ad-top"><div><h1>Recall admin</h1><div class="ad-sub">Administrator only · updated ' + new Date(data.generatedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + (data.cached ? ' (cached up to 10 min)' : '') + '</div></div>' +
    '<div style="display:flex;gap:8px"><a class="btn btn--ghost btn--sm" href="./" style="text-decoration:none">Back to Recall</a><button class="btn btn--ghost btn--sm" id="rf">Refresh</button><button class="btn btn--ghost btn--sm" id="so">Sign out</button></div></div>' +
    '<div class="ad-tabs" role="tablist">' + tabs + '</div><div id="pane"><div class="ad-msg">Loading…</div></div><p class="ad-sub" style="margin-top:8px">' + esc(data.note) + '</p>';
  root.querySelectorAll('.ad-tab').forEach((b) => { b.onclick = () => { tab = b.dataset.t; render(); }; });
  $('rf').onclick = () => load(true); $('so').onclick = () => window.__prov.signOut();
  const html = await TABS[tab][1](); if ($('pane')) $('pane').innerHTML = html;
}
