async function openEditor(key, addKey) {
  const found = key ? byKey(key) : null, t = found ? found.t : topicByKey(addKey); if (!t) return;
  const form0 = () => ({ question: '', options: ['', '', '', ''], answer: 0, explanation: '' });
  const isNewQ = !!(found && found.q._new), stagedOp = isNewQ ? findOp(found.q._tmp) : null;
  let initial = null, c = null;
  const L = openLayer({ kind: 'drawer', title: found ? (isNewQ ? 'Edit new question' : 'Edit question #' + found.q.id) : 'Add a question', sub: where(t), body: '<p class="rc-sub">Loading…</p>',
    beforeClose: async () => !(initial && JSON.stringify(read()) !== initial) || confirmDialog({ title: 'Discard your changes?', message: 'This question has edits that are not applied yet.', ok: 'Discard', danger: true }) });
  const read = () => {
    const f = L.body.querySelector('form'); if (!f) return null;
    const e = f.elements;
    return { question: e.question.value, options: Array.from(f.querySelectorAll('[data-o]')).map((i) => i.value), answer: Number((f.querySelector('input[name=answer]:checked') || {}).value), explanation: e.explanation.value };
  };

  let orig = null;   // the question as GitHub has it (the base the edit is measured against)
  if (found && !isNewQ) {
    try { c = await freshTopic(t); } catch (e) { return fail(e.message); }
    orig = c.questions.find((x) => String(x.id) === String(found.q.id));
    if (!orig) return fail('That question is no longer in the file. Reload the topic.');
  }

    '<div class="rc-field"><span>Answer options <em>Select the correct one</em></span>' + q.options.map((o, i) => '<label class="rc-opt"><input type="radio" name="answer" value="' + i + '"' + (i === q.answer ? ' checked' : '') + ' aria-label="Option ' + letter(i) + ' is correct"><b>' + letter(i) + '</b><input class="rc-in" data-o name="o' + i + '" value="' + esc(o) + '" aria-label="Option ' + letter(i) + '"></label>').join('') + '</div>' +
    '<label class="rc-field"><span>Explanation <em>shown after answering</em></span><textarea class="rc-in" name="explanation" rows="5">' + esc(q.explanation || '') + '</textarea></label><p class="rc-err" id="ederr" role="alert" hidden></p></form>';
  L.foot.hidden = false; L.foot.innerHTML = '<button class="btn btn--ghost" type="button" data-no>Cancel</button><button class="btn btn--primary" type="button" data-save>' + (found ? 'Apply edit' : 'Add question') + '</button>';
  initial = JSON.stringify(read());
  const cq = () => { $('cq').textContent = L.body.querySelector('[name=question]').value.length + ' characters'; }; cq(); L.body.querySelector('[name=question]').addEventListener('input', cq);
  L.foot.querySelector('[data-no]').onclick = () => L.tryClose(false);
  L.foot.querySelector('[data-save]').onclick = () => {
    const v = read(), err = (m) => { const el = $('ederr'); el.textContent = m; el.hidden = !m; };

    if (v.options.some((o) => !o.trim())) return err('Every option needs text.');
    if (!Number.isInteger(v.answer)) return err('Select the correct answer.');
    if (v.question.length > 3000 || v.explanation.length > 6000 || v.options.some((o) => o.length > 1000)) return err('The question (3000 characters), an option (1000) or the explanation (6000) is too long.');

  };
}

  const read = () => ({ label: f.elements.label.value.trim(), professor: f.elements.professor.value.trim(), hidden: vis ? !vis.checked : true });
  initial = JSON.stringify(read());
  L.foot.querySelector('[data-no]').onclick = () => L.tryClose(false);
  L.foot.querySelector('[data-save]').onclick = async () => {
    const v = read(), err = (m) => { const el = $('tferr'); el.textContent = m; el.hidden = !m; };
    const label = nameOf(v.label), professor = nameOf(v.professor);
    if (!label) return err('Give the topic a name.');
    if (label.length > 80) return err('The name is too long (80 characters at most).');
    if (professor.length > 60) return err('The professor is too long (60 characters at most).');
    if (BADCH.test(label) || BADCH.test(professor)) return err('The name cannot contain < > " ` or \\');
    err(''); initial = JSON.stringify(v);
    if (isNew) {
      const id = stageNewTopic(mid, exam, subject, label, professor); L.finish(true);
      toast('Topic added hidden, in your unsaved changes. Add its questions next.'); await loadBank(); location.hash = hashOf(mid, exam, subject, id); return;
    }
    const f = {}; if (label !== t.label) f.label = label; if (professor !== t.professor) f.professor = professor; if (v.hidden !== t.hidden) f.hidden = v.hidden;
    if (Object.keys(f).length) stageTopic(t, f);
    L.finish(true); if (Object.keys(f).length) toast('Added to your unsaved changes.'); show(true);
  };
}

// ---------- the save bar and the review drawer (the same on every tab) ----------
// Pattern: a contextual save bar like the one in Shopify admin (message "Unsaved changes", actions Save and Discard): it appears only while there is something to save, says what is pending,
// and offers Save / Discard (plus Review). It floats at the bottom so it never moves the page and stays in thumb reach on a phone.
let barEl = null;
function renderBar() {
  if (!barEl) { barEl = document.createElement('div'); barEl.id = 'savebar'; barEl.className = 'rc-savebar'; barEl.setAttribute('role', 'region'); barEl.setAttribute('aria-label', 'Unsaved changes'); barEl.hidden = true; document.body.appendChild(barEl); }
  const n = draft.ops.length, on = n > 0 && !!myUid && !!data;
  barEl.hidden = !on; document.body.classList.toggle('rc-has-savebar', on);
  if (!on) { barEl.innerHTML = ''; return; }
  const off = saving ? ' disabled' : '';
  barEl.innerHTML = '<div class="rc-savebar__msg"><span class="rc-savebar__dot" aria-hidden="true"></span><b>Unsaved changes</b><button class="rc-link" type="button" data-act="review">' + plural(n, 'change') + ' \u00b7 Review</button></div>' +
    '<div class="rc-savebar__acts"><button class="btn btn--ghost" type="button" data-act="discard"' + off + '>Discard</button><button class="btn btn--primary" type="button" data-act="save"' + off + '>' + (saving ? 'Saving\u2026' : 'Save') + '</button></div>';
}
function topicOfOp(o) {
  const path = o.path || ('data/' + ((cfg.modules.find((x) => x.id === o.moduleId) || {}).dataPath || o.moduleId) + '/' + o.exam + '/' + o.subject + '/' + o.topicId + '.json');
  return allTopics().find((t) => t.path === path) || null;
}
function describe(o) {
  const t = o.op === 'set_module' ? null : topicOfOp(o), loc = t ? where(t) : '';
  const yes = (v) => (v ? 'on' : 'off');
  if (o.op === 'set_module') {
    const m = ((cfg && cfg.modules) || []).find((x) => x.id === o.moduleId), bits = [];
    if (o.set.ongoing !== undefined) bits.push('Ongoing module: ' + yes(o.set.ongoing)); if (o.set.hidden !== undefined) bits.push(o.set.hidden ? 'Hidden from students' : 'Visible to students');
    return ['Module ' + ((m && (m.title || m.id)) || o.moduleId), bits.join(' \u00b7 ')];
  }
  if (o.op === 'set_topic') {
    const bt = baseTopicOf(o.moduleId, o.exam, o.subject, o.topicId) || {}, bits = [];
    if (o.set.label !== undefined) bits.push('Name: \u201c' + (bt.label || '') + '\u201d \u2192 \u201c' + o.set.label + '\u201d'); if (o.set.professor !== undefined) bits.push('Professor: ' + (o.set.professor || 'none'));
    if (o.set.hidden !== undefined) bits.push(o.set.hidden ? 'Hidden from students' : 'Visible to students');
    return ['Topic ' + (t ? t.label : o.topicId), [loc].concat(bits).filter(Boolean).join(' \u00b7 ')];
  }
  if (o.op === 'set_redline') { const m = cfg.modules.find((x) => x.id === o.moduleId) || {}, et = cfg.examTypes.find((x) => x.id === o.exam) || {}; return ['Redline Data link', (m.title || o.moduleId) + ' \u203a ' + (et.label || o.exam) + ' \u00b7 ' + (o.url ? (o.base ? 'changed to ' : 'set to ') + o.url : 'removed')]; }
  if (o.op === 'remove_topic') return ['Remove ' + (o.single ? 'exam' : 'topic') + ' ' + o.label, [o.loc, 'deletes ' + plural(o.nq, 'question') + ' and its data file'].filter(Boolean).join(' \u00b7 ')];
  if (o.op === 'add_topic') return [(o.subject === 'exam' ? 'New exam: ' : 'New topic: ') + o.label, [loc, o.makeVisible ? 'Visible to students' : 'Hidden until you approve it'].filter(Boolean).join(' \u00b7 ')];
  const short = (x) => String(x || '').slice(0, 90) + (String(x || '').length > 90 ? '\u2026' : '');
  if (o.op === 'q_add') return ['New question', [loc, short(o.question)].filter(Boolean).join(' \u00b7 ')];
  if (o.op === 'q_edit') {
    const ch = []; if (!sameVal(o.cur.question, o.orig.question)) ch.push('question'); if (!sameVal(o.cur.options, o.orig.options)) ch.push('options'); if (!sameVal(o.cur.answer, o.orig.answer)) ch.push('correct answer'); if (!sameVal(o.cur.explanation, o.orig.explanation)) ch.push('explanation');
    return ['Edited question #' + o.qid, [loc, 'Changed: ' + ch.join(', ')].filter(Boolean).join(' \u00b7 ')];
  }
  return ['Removed question #' + o.qid, [loc, short(o.orig && o.orig.question)].filter(Boolean).join(' \u00b7 ')];
}
async function openReview() {
  if (!dirty()) return;
  try { await loadBank(); } catch (e) { /* descriptions fall back to ids */ }
  const L = openLayer({ kind: 'drawer', title: 'Unsaved changes', sub: 'Nothing is on GitHub until you save. Saving makes one commit.', body: '',
    foot: '<button class="btn btn--ghost" type="button" data-rdiscard>Discard all</button><button class="btn btn--primary" type="button" data-rsave>Save</button>' });
  const draw = () => {
    if (!dirty()) { L.finish(true); return; }
    L.body.innerHTML = '<div class="rc-chg">' + draft.ops.map((o) => { const [a, b] = describe(o); return '<div class="rc-chg__row"><div><b>' + esc(a) + '</b><small>' + esc(b) + '</small></div><button class="rc-link" type="button" data-rundo="' + esc(o.id) + '">Undo</button></div>'; }).join('') + '</div>';
    const n = draft.ops.length; L.panel.querySelector('.rc-layer__head h2').textContent = plural(n, 'unsaved change');
  };
  L.body.addEventListener('click', (e) => { const u = e.target.closest('[data-rundo]'); if (u) { undoOp(u.dataset.rundo); draw(); if ($('pane')) show(true); } });
  L.foot.querySelector('[data-rdiscard]').onclick = async () => { if (await discardDraft()) L.finish(true); };
  L.foot.querySelector('[data-rsave]').onclick = async () => { const b = L.foot.querySelector('[data-rsave]'); b.disabled = true; const ok = await saveDraft(); if (ok) L.finish(true); else { b.disabled = false; draw(); } };
  draw();
}

// ---------- Students ----------
const day = (t) => (t ? new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: '2-digit' }) : '–');
function studentRows() {
  const f = studTerm.trim().toLowerCase();
  const list = studentList.filter((s) => (studFilter === 'all' || (studFilter === 'admins' && (s.is_admin || s.owner)) || (studFilter === 'removed' && s.blocked)) && (!f || [s.email, s.first_name, s.last_name, s.uid].join(' ').toLowerCase().includes(f)));
  if (!list.length) return '<tr><td class="rc-low" colspan="7">No accounts match.</td></tr>';
  return list.map((s) => {
    const role = s.owner ? badge('Owner', 'ongoing') + ' ' : s.is_admin ? badge('Admin', 'ongoing') + ' ' : '', acts = [];
    if (s.blocked) acts.push('<span class="rc-bad">Removed</span> <button class="rc-link" type="button" data-ub="' + esc(s.uid) + '">Unblock</button>');
    else if (!s.owner && !s.is_admin) acts.push('<button class="rc-link rc-link--warn" type="button" data-rm="' + esc(s.uid) + '">Remove</button>');
    if (meOwner && !s.owner && !s.blocked) acts.push(s.is_admin ? '<button class="rc-link rc-link--warn" type="button" data-rma="' + esc(s.uid) + '">Remove admin</button>' : '<button class="rc-link" type="button" data-mk="' + esc(s.uid) + '">Make admin</button>');
    return '<tr><td data-l="Name"><b>' + (esc([s.first_name, s.last_name].filter(Boolean).join(' ')) || '<span class="rc-low">no name</span>') + '</b><small>' + esc(s.uid) + '</small></td>' +
      '<td data-l="Email">' + (s.email ? esc(s.email) : '<span class="rc-low">not yet on file</span>') + '</td><td data-l="Joined">' + day(s.created_at) + '</td><td data-l="Last exam">' + day(s.last_exam) + '</td>' +
      '<td class="n" data-l="Exams">' + s.exams + '</td><td class="n" data-l="Correct">' + (s.attempted ? Math.round((s.correct / s.attempted) * 100) + '%' : '–') + '</td><td data-l="Role">' + role + acts.join(' ') + '</td></tr>';
  }).join('');
}
async function students() {
  const r = await adminFetch('/api/admin/students');
  if (r.status !== 200 || !r.body.ok) return '<div class="rc-msg">Could not load the student list.</div>';
  studentList = r.body.students; meOwner = !!(r.body.me && r.body.me.owner);
  const n = (f) => studentList.filter(f).length, chip = (k, l) => '<button class="btn btn--sm ' + (studFilter === k ? 'btn--primary' : 'btn--ghost') + '" type="button" data-sf="' + k + '" aria-pressed="' + (studFilter === k) + '">' + l + '</button>';
  return '<div class="page rc-wide"><header class="page__header"><div><h1 class="page__title">Students</h1><p class="page__subtitle">' + studentList.length + ' accounts. Emails appear once a person has signed in after the email update.' + (meOwner ? '' : ' Only an owner can make or remove admins.') + '</p></div></header>' +
    '<label class="rc-search">' + ic('search') + '<input id="sq" type="search" placeholder="Search name, email or id" aria-label="Search students" value="' + esc(studTerm) + '"></label>' +
    '<div class="rc-chips">' + chip('all', 'All ' + studentList.length) + chip('admins', 'Admins ' + n((s) => s.is_admin || s.owner)) + chip('removed', 'Removed ' + n((s) => s.blocked)) + '</div>' +
    '<div class="rc-card rc-scroll"><table class="rc-t rc-stack"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last exam</th><th class="n">Exams</th><th class="n">Correct</th><th>Role / actions</th></tr></thead><tbody id="sb">' + studentRows() + '</tbody></table>' +
    '<p>Admins can open this page, see student emails, and edit or remove questions and topics. Remove deletes a student\u2019s cloud data and blocks the account from syncing; their login stays in Firebase until you delete it there. To remove an admin account, first remove its admin rights.</p></div></div>';
}
async function studentAction(uid, action) {
  const s = studentList.find((x) => x.uid === uid), who = esc((s && (s.email || [s.first_name, s.last_name].filter(Boolean).join(' '))) || uid);
  const ask = { remove: ['Remove ' + who + '?', 'Their cloud progress is deleted and the account is blocked from syncing. Their Firebase login stays until you delete it there.', 'Remove', true],
    make_admin: ['Make ' + who + ' an admin?', 'Admins can open this page, see every student\u2019s email, and edit or remove questions and topics.', 'Make admin', false],
    remove_admin: ['Remove admin rights from ' + who + '?', 'They keep their student account.', 'Remove admin', true] }[action];
  if (ask && !(await confirmDialog({ title: ask[0], message: ask[1], ok: ask[2], danger: ask[3] }))) return;
  const r = await adminFetch('/api/admin/student', { method: 'POST', body: JSON.stringify({ uid, action }) });
  if (r.status !== 200) { toast(r.body.message || 'That did not work.', true); return; }
  toast(action === 'unblock' ? 'Account unblocked.' : action === 'remove' ? 'Account removed.' : action === 'make_admin' ? 'Admin rights given.' : 'Admin rights removed.'); show();
}

// ---------- Retention and System ----------
function retention() {
  const a = data.activation, cr = data.cohorts.map((c) => '<tr><td>' + new Date(c.weekStart).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + '</td><td class="n">' + c.size + '</td>' +
    c.retained.map((n) => '<td class="n' + (n == null ? ' rc-low' : '') + '">' + (n == null ? '–' : n + ' (' + pct(n, c.size) + '%)') + '</td>').join('') + '</tr>').join('');
  return '<div class="page rc-wide"><header class="page__header"><div><h1 class="page__title">Retention</h1><p class="page__subtitle">Do students come back?</p></div></header><div class="stats-strip rc-strip">' +
    kpi('Studied at least once', pct(a.ever, a.signups) == null ? '–' : pct(a.ever, a.signups) + '%', 'of ' + a.signups + ' signups, last 8 weeks') +
    kpi('First exam within 24 h', pct(a.within24h, a.eligible24h) == null ? '–' : pct(a.within24h, a.eligible24h) + '%', 'of signups older than a day') +
    kpi('First exam within 7 days', pct(a.within7d, a.eligible7d) == null ? '–' : pct(a.within7d, a.eligible7d) + '%', 'of signups older than a week') +
    kpi('Median time to first exam', a.medianHours == null ? '–' : a.medianHours + ' h', 'after signing up') + '</div>' +
    '<div class="rc-card rc-scroll"><h2>Weekly signup cohorts: studied again in week…</h2><table class="rc-t"><thead><tr><th>Week of</th><th class="n">Signed up</th><th class="n">Week 0</th><th class="n">Week 1</th><th class="n">Week 2</th><th class="n">Week 3</th></tr></thead><tbody>' +
    (cr || '<tr><td class="rc-low" colspan="6">No signups in the last 8 weeks.</td></tr>') + '</tbody></table><p>"Studied" means finished at least one exam that week. Weeks run Thursday to Wednesday (UTC). With few students, treat single percentages loosely.</p></div></div>';
}
function system() {
  const t = data.totals, next = new Date(); next.setUTCHours(24, 0, 0, 0);
  const hrs = Math.round((next - Date.now()) / 36e5 * 10) / 10;
  return '<div class="page rc-wide"><header class="page__header"><div><h1 class="page__title">System</h1><p class="page__subtitle">Usage and limits</p></div></header><div class="stats-strip rc-strip">' + kpi('Users', fmt(t.users)) + kpi('Exams stored', fmt(t.attempts)) + kpi('Topic rows', fmt(t.scopes)) + kpi('Daily limits reset in', hrs + ' h', '00:00 UTC') + '</div>' +
    '<div class="rc-card rc-links"><h2>Live usage (needs your Cloudflare and Firebase login)</h2>' +
    '<a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare: Workers &amp; Pages, Usage</a><a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare: D1, Metrics</a>' +
    '<a href="https://console.firebase.google.com/project/recall-med/authentication/users" target="_blank" rel="noopener">Firebase: Authentication</a>' +
    '<p>Request counts and database reads and writes are not available here, because reading them would need an extra secret. Editing content uses a GitHub token stored only as an encrypted Cloudflare variable. Free-plan reminders: 60 exam uploads per hour per account; D1 allows 100,000 row writes per day.</p></div></div>';
}
const VIEWS = { overview: async () => overview(), content, students, retention: async () => retention(), system: async () => system() };

// ---------- clicks ----------
function stagedToggle(fn, msg) { fn(); toast(msg); show(true); }
const STUDENT_BTN = '[data-rm],[data-ub],[data-mk],[data-rma]';
document.addEventListener('click', async (e) => {
  if (!root.contains(e.target) && !e.target.closest('#savebar')) return;
  const b = e.target.closest('[data-act],[data-add],[data-sf],' + STUDENT_BTN);
  if (b) {
    const d = b.dataset;
    if (d.act === 'edit') return openEditor(d.key);
    if (d.act === 'del') return removeQuestion(d.key);
    if (d.act === 'undel') { const f = byKey(d.key); if (f) { undoOp('qd:' + f.t.path + '#' + f.q.id); show(true); } return; }
    if (d.act === 'review') return openReview();
    if (d.act === 'discard') return discardDraft();
    if (d.act === 'save') { await saveDraft(); return; }
    if (d.add) return openEditor(null, d.add);
    if (d.act === 'tdetails') return openTopicEditor(topicByKey(d.tk));
    if (d.act === 'rmtopic') { const t = topicByKey(d.tk); if (!t) return; const wasOnTopicPage = parseRoute().parts.length >= 4; stageRemoveTopic(t); toast(stagedTopicGone(t) ? 'Dropped.' : 'Removal added to your unsaved changes. The data file is deleted when you save.'); if (wasOnTopicPage) location.hash = hashOf(t.module); else show(true); return; }
    if (d.act === 'addsingle') { const [mid, exam] = d.ek.split('|'); stageAddSingle(mid, exam); toast('Added hidden, in your unsaved changes. Add its questions next.'); await loadBank(); location.hash = hashOf(mid, exam, 'exam', 'exam'); return; }
    if (d.act === 'redline') { const [mid, exam] = d.ek.split('|'); return openRedline(mid, exam); }
    if (d.act === 'rmredline') { const [mid, exam] = d.ek.split('|'); stageRedline(mid, exam, ''); toast('Link removal added to your unsaved changes.'); show(true); return; }
    if (d.act === 'newtopic') return openTopicEditor(null, d.sk);
    if (d.act === 'publish') { const t = topicByKey(d.tk); if (t) return stagedToggle(() => stageTopic(t, { hidden: false }), 'Visible to students once you save.'); }
    if (d.sf) { studFilter = d.sf; document.querySelectorAll('[data-sf]').forEach((x) => { const on = x.dataset.sf === studFilter; x.setAttribute('aria-pressed', on); x.classList.toggle('btn--primary', on); x.classList.toggle('btn--ghost', !on); }); $('sb').innerHTML = studentRows(); return; }
    const uid = d.rm || d.ub || d.mk || d.rma;
    if (uid) return studentAction(uid, d.rm ? 'remove' : d.ub ? 'unblock' : d.mk ? 'make_admin' : 'remove_admin');
  }
  const go = e.target.closest('[data-go]'); if (go && !e.target.closest('button,a,input,label')) location.hash = go.dataset.go;
});
document.addEventListener('change', async (e) => {
  const tg = e.target; if (!tg.matches || !tg.matches('input.toggle[data-sw]') || !root.contains(tg)) return;
  const k = tg.dataset.sw, on = tg.checked;   // the state it is switching TO
  if (k === 'mod-ongoing') return stagedToggle(() => stageModule(tg.dataset.m, 'ongoing', on), on ? 'Ongoing module: added to your unsaved changes.' : 'Not ongoing: added to your unsaved changes.');
  if (k === 'mod-visible') return stagedToggle(() => stageModule(tg.dataset.m, 'hidden', !on), on ? 'Module visible once you save.' : 'Module hidden once you save.');
  if (k === 'topic') { const t = topicByKey(tg.dataset.tk); if (t) return stagedToggle(() => stageTopic(t, { hidden: !on }), on ? 'Topic visible once you save.' : 'Topic hidden once you save.'); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-go]')) location.hash = e.target.dataset.go; });
document.addEventListener('input', (e) => { if (e.target.id === 'sq' && $('sb')) { studTerm = e.target.value; $('sb').innerHTML = studentRows(); } });
</script>
