// ---------- toasts ----------
const toastBox = document.createElement('div'); toastBox.className = 'ad-toasts'; toastBox.setAttribute('role', 'status'); toastBox.setAttribute('aria-live', 'polite'); document.body.appendChild(toastBox);
function toast(msg, bad) { const t = document.createElement('div'); t.className = 'ad-toast' + (bad ? ' ad-toast--bad' : ''); t.textContent = msg; toastBox.appendChild(t); setTimeout(() => t.remove(), bad ? 7000 : 4200); }

// ---------- layers (drawers and dialogs) ----------
// Rule: a layer closes ONLY with its X button, the Escape key, or the browser/phone Back button. Tapping outside never closes it.
// Each layer adds one history entry; Back removes it. History changes are chained so entries never get out of step.
const layers = []; let swallow = 0, backDone = null, chain = Promise.resolve(), lid = 0;
const histPush = (st) => { chain = chain.then(() => { try { history.pushState(st, '', location.href); } catch (e) { /* ignore */ } }); };
const histBack = () => { chain = chain.then(() => new Promise((res) => {
  swallow++; const t = setTimeout(() => { swallow = Math.max(0, swallow - 1); backDone = null; res(); }, 500);
  backDone = () => { clearTimeout(t); backDone = null; res(); };
  try { history.back(); } catch (e) { clearTimeout(t); swallow = 0; res(); }
})); };
window.addEventListener('popstate', () => {
  if (swallow > 0) { swallow--; if (backDone) backDone(); return; }
  const top = layers[layers.length - 1]; if (top) top.tryClose(true);
});
document.addEventListener('keydown', (e) => {
  const top = layers[layers.length - 1]; if (!top) return;
  if (e.key === 'Escape') { e.preventDefault(); top.tryClose(false); return; }
  if (e.key === 'Tab') {   // keep keyboard focus inside the open layer
    const f = Array.from(top.panel.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,select,a[href]')).filter((x) => x.offsetParent !== null || x === document.activeElement);
    if (!f.length) return; const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
});
function openLayer(o) {
  const id = ++lid, kind = o.kind || 'drawer', prev = document.activeElement;
  const scrim = document.createElement('div'); scrim.className = 'ad-scrim' + (kind === 'dialog' ? ' ad-scrim--dialog' : '');
  scrim.innerHTML = '<div class="ad-layer ad-layer--' + kind + '" role="dialog" aria-modal="true" aria-labelledby="lt' + id + '"><div class="ad-layer__head"><div><h2 id="lt' + id + '">' + esc(o.title) + '</h2>' +
    (o.sub ? '<p class="ad-sub">' + esc(o.sub) + '</p>' : '') + '</div><button class="ad-ibtn" type="button" data-x aria-label="Close">' + ic('x') + '</button></div><div class="ad-layer__body"></div><div class="ad-layer__foot"></div></div>';
  // no click handler on the scrim: tapping outside the panel does nothing
  const L = { id, el: scrim, panel: scrim.firstChild, body: scrim.querySelector('.ad-layer__body'), foot: scrim.querySelector('.ad-layer__foot'), closing: false };
  L.body.innerHTML = o.body || ''; L.foot.innerHTML = o.foot || ''; if (!o.foot) L.foot.hidden = true;
  L.finish = (dropEntry) => { const i = layers.indexOf(L); if (i < 0) return; layers.splice(i, 1); scrim.remove(); document.body.style.overflow = layers.length ? 'hidden' : ''; if (dropEntry) histBack(); if (prev && prev.focus && document.contains(prev)) prev.focus(); };
  L.tryClose = async (fromPop) => {
    if (L.closing || layers[layers.length - 1] !== L) return; L.closing = true;
    let ok = true; try { ok = o.beforeClose ? await o.beforeClose() : true; } finally { L.closing = false; }
    if (ok) L.finish(!fromPop); else if (fromPop) histPush({ layer: id });
  };
  scrim.querySelector('[data-x]').onclick = () => L.tryClose(false);
  layers.push(L); document.body.appendChild(scrim); document.body.style.overflow = 'hidden'; histPush({ layer: id });
  setTimeout(() => { const f = L.body.querySelector('.ad-in,textarea,input') || L.foot.querySelector('button.btn--primary') || scrim.querySelector('[data-x]'); if (f) f.focus(); }, 30);
  return L;
}
function confirmDialog(o) {
  return new Promise((resolve) => {
    let settled = false; const settle = (v) => { if (!settled) { settled = true; resolve(v); } };
    const L = openLayer({ kind: 'dialog', title: o.title, body: '<p style="margin:0;font-size:.9rem;line-height:1.55;color:var(--text-2)">' + o.message + '</p>',
      foot: '<button class="btn btn--ghost" type="button" data-no>Cancel</button><button class="btn ' + (o.danger ? 'btn--danger' : 'btn--primary') + '" type="button" data-ok>' + esc(o.ok || 'Confirm') + '</button>',
      beforeClose: async () => { settle(false); return true; } });
    L.foot.querySelector('[data-no]').onclick = () => L.tryClose(false);
    L.foot.querySelector('[data-ok]').onclick = () => { settle(true); L.finish(true); };
  });
}

// ---------- data ----------
async function adminFetch(url, opts) {
  const call = async (force) => fetch(url, { ...(opts || {}), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (await window.__prov.getToken(force)) } });
  let res = await call(false); if (res.status === 401) res = await call(true);
  return { status: res.status, body: await res.json().catch(() => ({})) };
}
async function load(refresh) {
  if (loading) return; loading = true;
  try {
    const r = await adminFetch('/api/admin/summary' + (refresh ? '?refresh=1' : ''));
    if (r.status === 403) { root.innerHTML = '<div class="ad-msg">This account is not an administrator.<br><button class="btn btn--ghost" id="so" style="margin-top:12px">Sign out</button></div>'; $('so').onclick = () => window.__prov.signOut(); return; }
    if (!r.body || !r.body.ok) throw new Error('bad');
    data = r.body; if (refresh) { cfg = null; Object.keys(qcache).forEach((k) => delete qcache[k]); }
    renderShell(); show();
  } catch (e) {
    root.innerHTML = '<div class="ad-msg">Could not load the dashboard. Check your connection.<br><button class="btn btn--ghost" id="rt" style="margin-top:12px">Try again</button></div>';
    $('rt').onclick = () => load(true);
  } finally { loading = false; }
}
async function loadCfg() {
  if (cfg) return;
  const r = await adminFetch('/api/admin/config');   // fresh from GitHub, so a change made a minute ago is already in it
  if (r.status === 200 && r.body.ok) { cfg = r.body.config; cfgErr = ''; return; }
  cfgErr = r.body.message || 'Could not read the site configuration from GitHub.';
  cfg = await fetch('config/modules.json').then((x) => x.json());   // read-only fallback: the deployed copy
}
async function cfgPost(body) {
  const r = await adminFetch('/api/admin/config', { method: 'POST', body: JSON.stringify(body) });
  if (r.status === 200 && r.body.ok) { cfg = r.body.config; cfgErr = ''; return r.body; }
  throw new Error(r.body.message || 'That did not work.');
}
const lab = (arr, id) => ((arr || []).find((x) => x.id === id) || {}).label || id;
function allTopics() {
  const out = [];
  ((cfg && cfg.modules) || []).forEach((m) => Object.entries(m.subSubjects || {}).forEach(([exam, subs]) => Object.entries(subs).forEach(([subject, list]) => (list || []).forEach((ss) => out.push({
    m, module: m.id, moduleTitle: m.shortTitle || m.title || m.id, exam, examLabel: lab(cfg.examTypes, exam), subject, subjectLabel: lab(cfg.subjects, subject), ss, sub: ss.id,
    label: ss.label || ss.id, professor: ss.professor || '', hidden: !!ss.hidden, path: 'data/' + (m.dataPath || m.id) + '/' + exam + '/' + subject + '/' + ss.id + '.json' })))));
  return out;
}
const tkey = (t) => [t.module, t.exam, t.subject, t.sub].join('|');
const topicByKey = (k) => allTopics().find((t) => tkey(t) === k);
const qs = (t) => (qcache[t.path] && qcache[t.path].questions) || [];
const nq = (list) => list.reduce((s, t) => s + qs(t).length, 0);
const keyOf = (t, q) => tkey(t) + '|' + q.id;
function byKey(key) { for (const t of allTopics()) { const q = qs(t).find((x) => keyOf(t, x) === key); if (q) return { t, q }; } return null; }
const hashOf = (...p) => '#content/' + p.filter(Boolean).map(enc).join('/');
// Every topic's questions from the deployed data files (used for counts and search); a topic's own page reads fresh from GitHub.
async function loadBank() {
  await loadCfg();
  await Promise.all(allTopics().filter((t) => !qcache[t.path]).map((t) => fetch(t.path + '?v=' + Date.now()).then((r) => (r.ok ? r.json() : null)).catch(() => null).then((d) => {
    qcache[t.path] = { questions: d ? (Array.isArray(d) ? d : d.questions || []) : [], sha: null, fresh: false };
  })));
}
async function freshTopic(t) {
  if (qcache[t.path] && qcache[t.path].fresh) return qcache[t.path];
  const r = await adminFetch('/api/admin/question?path=' + enc(t.path) + '&full=1');
  if (r.status !== 200 || !r.body.ok) throw new Error(r.body.message || 'Could not open the topic.');
  return (qcache[t.path] = { questions: r.body.questions, sha: r.body.sha, fresh: true });
}

// ---------- shell and routing ----------
const SECTIONS = { overview: 'Overview', content: 'Content', students: 'Students', retention: 'Retention', system: 'System' };
const parseRoute = () => { const p = decodeURIComponent(location.hash.replace(/^#\/?/, '')).split('/').filter(Boolean); return { sec: SECTIONS[p[0]] ? p[0] : 'overview', parts: p.slice(1) }; };
function renderShell() {
  root.innerHTML = '<div class="ad-shell"><aside class="ad-side"><div class="ad-brand">Recall<small>Admin</small></div><nav class="ad-nav" id="nav" aria-label="Sections">' +
    Object.entries(SECTIONS).map(([k, v]) => '<a href="#' + k + '" data-sec="' + k + '">' + ic(k) + '<span>' + v + '</span></a>').join('') + '</nav></aside>' +
    '<main class="ad-main"><div class="ad-head"><div class="ad-crumbs" id="crumbs"></div><div class="ad-tools">' +
    '<a class="ad-ibtn" href="./" title="Back to Recall" aria-label="Back to Recall">' + ic('app') + '</a>' +
    '<button class="ad-ibtn" id="rf" type="button" title="Refresh data" aria-label="Refresh data">' + ic('refresh') + '</button>' +
    '<button class="ad-ibtn" id="so" type="button" title="Sign out" aria-label="Sign out">' + ic('logout') + '</button></div></div><div id="pane"><div class="ad-msg">Loading…</div></div></main></div>';
  $('rf').onclick = () => load(true); $('so').onclick = () => window.__prov.signOut();
}
window.addEventListener('hashchange', () => { if (data && $('pane')) show(); });
async function show() {
  const my = ++renderId, { sec, parts } = parseRoute();
  document.querySelectorAll('#nav a').forEach((a) => { if (a.dataset.sec === sec) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const pane = $('pane'); if (!pane) return;
  pane.innerHTML = '<div class="ad-msg">Loading…</div>'; $('crumbs').innerHTML = '<b>' + SECTIONS[sec] + '</b>';
  let html = '';
  try { html = await VIEWS[sec](parts); } catch (e) { html = '<div class="ad-msg">' + esc(e && e.message ? e.message : 'Something went wrong.') + '</div>'; }
  if (my !== renderId || !$('pane')) return;
  $('pane').innerHTML = html; window.scrollTo(0, 0);
  if (sec === 'content') afterContent();
}
function crumbs(items) { $('crumbs').innerHTML = items.map((c, i) => (i === items.length - 1 ? '<b>' + esc(c[0]) + '</b>' : '<a href="' + c[1] + '">' + esc(c[0]) + '</a>' + ic('chev'))).join(''); }
const kpi = (label, value, sub) => '<div class="ad-kpi"><span>' + label + '</span><b>' + value + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>';
const sw = (on, attrs, label) => '<button class="ad-switch" type="button" role="switch" aria-checked="' + !!on + '" aria-label="' + esc(label) + '" ' + attrs + '></button>';
const pill = (t, c) => '<span class="ad-pill' + (c ? ' ad-pill--' + c : '') + '">' + t + '</span>';

// ---------- Overview ----------
function overview() {
  const d = data, days = [];
  for (let i = 29; i >= 0; i--) { const t = new Date(Date.now() - i * 864e5).toISOString().slice(0, 10); const r = d.examsPerDay.find((x) => x.day === t); days.push({ t, n: r ? r.exams : 0 }); }
  const max = Math.max(1, ...days.map((x) => x.n));
  const bars = days.map((x, i) => '<rect x="' + (i * 20 + 2) + '" y="' + (80 - (x.n / max) * 76) + '" width="16" height="' + Math.max(1, (x.n / max) * 76) + '" rx="3" fill="var(--primary-light)"><title>' + x.t + ': ' + x.n + ' exams</title></rect>').join('');
  const cairoH = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', hour: '2-digit', hour12: false }).format(new Date())) % 24;
  const off = (cairoH - new Date().getUTCHours() + 24) % 24, hrs = Array(24).fill(0);
  d.examsPerHourUtc.forEach((r) => { hrs[(r.h + off) % 24] += r.n; });
  const hmax = Math.max(1, ...hrs);
  const heat = hrs.map((n, h) => '<i title="' + h + ':00 Cairo: ' + n + ' exams" style="opacity:' + (0.08 + 0.92 * (n / hmax)).toFixed(2) + '"></i>').join('');
  const att = d.accuracy.reduce((s, r) => s + (r.attempted || 0), 0), cor = d.accuracy.reduce((s, r) => s + (r.correct || 0), 0);
  const mods = d.examsPerModule.map((m) => '<tr><td>' + esc(m.module) + '</td><td class="n">' + fmt(m.exams) + '</td><td><span class="ad-bar" style="width:' + Math.round((m.exams / d.examsPerModule[0].exams) * 100) + 'px"></span></td></tr>').join('');
  const subs = d.accuracy.map((r) => '<tr><td>' + esc(r.module) + ' / ' + esc(r.subject || 'whole module') + '</td><td class="n">' + fmt(r.exams) + '</td><td class="n">' + fmt(r.attempted) + '</td><td class="n' + (r.accuracyPct != null && r.accuracyPct < 50 ? ' ad-bad' : '') + '">' + (r.accuracyPct == null ? '–' : r.accuracyPct + '%') + '</td></tr>').join('');
  return '<div class="ad-pagehead"><div><h1 class="ad-title">Overview</h1><p class="ad-sub">Updated ' + new Date(d.generatedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + (d.cached ? ' (cached up to 10 min)' : '') + '</p></div></div>' +
    '<div class="ad-kpis">' + kpi('Accounts', fmt(d.accounts), fmt(d.newWeek) + ' new in 7 days · ' + fmt(d.newToday) + ' today') +
    kpi('Studying today', fmt(d.studyingToday), 'finished an exam · 7 days: ' + fmt(d.studyingWeek)) +
    kpi('Studying (30 days)', fmt(d.studyingMonth), 'stickiness ' + (pct(d.studyingToday, d.studyingMonth) ?? '–') + '% (today ÷ 30 days)') +
    kpi('Exams (30 days)', fmt(d.examsTotal), 'average ' + Math.round((d.avgTimeSec || 0) / 60) + ' min each') +
    kpi('Accuracy (30 days)', att ? pct(cor, att) + '%' : '–', fmt(att) + ' answers') + '</div>' +
    '<div class="ad-card"><h2>Exams per day (UTC dates)</h2><svg viewBox="0 0 600 84" width="100%" role="img" aria-label="Exams per day">' + bars + '</svg></div>' +
    '<div class="ad-card"><h2>When students study (Cairo time, 30 days)</h2><div class="ad-heat">' + heat + '</div><div class="ad-hl"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div><p>Darker is busier. Cloudflare daily limits reset at 00:00 UTC.</p></div>' +
    '<div class="ad-card ad-scroll"><h2>Exams by module (30 days)</h2><table class="ad-t"><tbody>' + (mods || '<tr><td class="ad-low">No exams yet.</td></tr>') + '</tbody></table></div>' +
    '<div class="ad-card ad-scroll"><h2>Accuracy by subject (30 days)</h2><table class="ad-t"><thead><tr><th>Subject</th><th class="n">Exams</th><th class="n">Answers</th><th class="n">Correct</th></tr></thead><tbody>' + (subs || '<tr><td class="ad-low" colspan="4">No exams yet.</td></tr>') + '</tbody></table></div>' +
    '<p class="ad-note">' + esc(d.note) + '</p>';
}

// ---------- Content: Module > Subject > Topic > Questions ----------
const statsOf = (t, q) => {
  const it = (data.items || []).find((i) => i.key === keyOf(t, q)); if (!it) return null;
  const c = Object.entries(it.counts).filter(([a]) => Number(a) >= 0), n = c.reduce((s, [, x]) => s + x, 0); if (!n) return null;
  const top = c.slice().sort((x, y) => y[1] - x[1])[0];
  return { n, pct: pct(it.counts[q.answer] || 0, n), topOpt: Number(top[0]), topPct: pct(top[1], n) };
};
const savedOf = (t, q) => { const s = (data.saved || []).find((x) => x.qk === keyOf(t, q)); return s ? s.students : 0; };
const where = (t) => t.moduleTitle + ' › ' + t.examLabel + ' › ' + t.subjectLabel + ' › ' + t.label;
function ghLink(t) { return '<a class="btn btn--ghost btn--sm" href="https://github.com/' + REPO + '/blob/main/' + esc(t.path) + '" target="_blank" rel="noopener">' + ic('code', 'ad-i--sm') + ' Open file on GitHub</a>'; }
function setupBanner() { return cfgErr ? '<div class="ad-banner"><div><b>Editing is not available yet</b>' + esc(cfgErr) + '</div></div>' : ''; }

async function content(parts) {
  await loadBank();
  const [modId, exam, subject, topicId] = parts;
  if (!modId) return contentHome();
  const m = cfg.modules.find((x) => x.id === modId); if (!m) return '<div class="ad-msg">That module does not exist.</div>';
  if (!exam || !(cfg.examTypes || []).some((e) => e.id === exam) || !subject) return moduleView(m, (cfg.examTypes || []).some((e) => e.id === exam) ? exam : (cfg.examTypes[0] || {}).id);
  if (!(cfg.subjects || []).some((s) => s.id === subject)) return '<div class="ad-msg">That subject does not exist.</div>';
  if (!topicId) return subjectView(m, exam, subject);
  const t = allTopics().find((x) => x.module === modId && x.exam === exam && x.subject === subject && x.sub === topicId);
  if (!t) return '<div class="ad-msg">That topic does not exist.</div>';
  return topicView(t);

async function openEditor(key, addKey) {

    beforeClose: async () => !(initial && JSON.stringify(read()) !== initial) || confirmDialog({ title: 'Discard your changes?', message: 'This question has edits that are not saved.', ok: 'Discard', danger: true }) });

  };

  if (!q) return fail('That question is no longer in the file. Reload the topic.');

    '<div class="ad-field"><span>Answer options <em>Select the correct one</em></span>' + q.options.map((o, i) => '<label class="ad-opt"><input type="radio" name="answer" value="' + i + '"' + (i === q.answer ? ' checked' : '') + ' aria-label="Option ' + letter(i) + ' is correct"><b>' + letter(i) + '</b><input class="ad-in" data-o name="o' + i + '" value="' + esc(o) + '" aria-label="Option ' + letter(i) + '"></label>').join('') + '</div>' +
    '<label class="ad-field"><span>Explanation <em>shown after answering</em></span><textarea class="ad-in" name="explanation" rows="5">' + esc(q.explanation || '') + '</textarea></label><p class="ad-err" id="ederr" role="alert" hidden></p></form>';
  L.foot.hidden = false; L.foot.innerHTML = '<button class="btn btn--ghost" type="button" data-no>Cancel</button><button class="btn btn--primary" type="button" data-save>' + (found ? 'Save to GitHub' : 'Add to GitHub') + '</button>';
  initial = JSON.stringify(read());
  const cq = () => { $('cq').textContent = L.body.querySelector('[name=question]').value.length + ' characters'; }; cq(); L.body.querySelector('[name=question]').addEventListener('input', cq);
  L.foot.querySelector('[data-no]').onclick = () => L.tryClose(false);
  L.foot.querySelector('[data-save]').onclick = async () => {
    const v = read(), err = (m) => { const el = $('ederr'); el.textContent = m; el.hidden = !m; };

async function removeQuestion(key) {
  const f = byKey(key); if (!f) return;
  const ok = await confirmDialog({ title: 'Remove question #' + f.q.id + '?', ok: 'Remove', danger: true,
    message: '\u201c' + esc(String(f.q.question).slice(0, 180)) + '\u201d<br><br>This commits the removal to GitHub. The other questions keep their numbers. Copies students already saved on their own devices are not touched.' });
  if (!ok) return;
  try {
    const c = await freshTopic(f.t);
    const s = await adminFetch('/api/admin/question', { method: 'POST', body: JSON.stringify({ action: 'delete', path: f.t.path, id: f.q.id, sha: c.sha }) });
    if (s.status !== 200 || !s.body.ok) { if (s.status === 409) delete qcache[f.t.path]; throw new Error(s.body.message || 'Could not remove it.'); }
    c.sha = s.body.sha || c.sha; c.questions = c.questions.filter((x) => String(x.id) !== String(f.q.id));
    toast('Removed question #' + f.q.id + '. Students see the change in about a minute.');
  } catch (e) { toast(e.message, true); }
  show();
}

    const role = s.owner ? pill('Owner', 'info') + ' ' : s.is_admin ? pill('Admin', 'info') + ' ' : '', acts = [];
    if (s.blocked) acts.push('<span class="ad-bad">Removed</span> <button class="ad-link" type="button" data-ub="' + esc(s.uid) + '">Unblock</button>');
    else if (!s.owner && !s.is_admin) acts.push('<button class="ad-link ad-link--warn" type="button" data-rm="' + esc(s.uid) + '">Remove</button>');
    if (meOwner && !s.owner && !s.blocked) acts.push(s.is_admin ? '<button class="ad-link ad-link--warn" type="button" data-rma="' + esc(s.uid) + '">Remove admin</button>' : '<button class="ad-link" type="button" data-mk="' + esc(s.uid) + '">Make admin</button>');
    return '<tr><td data-l="Name"><b>' + (esc([s.first_name, s.last_name].filter(Boolean).join(' ')) || '<span class="ad-low">no name</span>') + '</b><small>' + esc(s.uid) + '</small></td>' +
      '<td data-l="Email">' + (s.email ? esc(s.email) : '<span class="ad-low">not yet on file</span>') + '</td><td data-l="Joined">' + day(s.created_at) + '</td><td data-l="Last exam">' + day(s.last_exam) + '</td>' +
      '<td class="n" data-l="Exams">' + s.exams + '</td><td class="n" data-l="Correct">' + (s.attempted ? Math.round((s.correct / s.attempted) * 100) + '%' : '–') + '</td><td data-l="Role">' + role + acts.join(' ') + '</td></tr>';
  }).join('');
}
async function students() {
  const r = await adminFetch('/api/admin/students');
  if (r.status !== 200 || !r.body.ok) return '<div class="ad-msg">Could not load the student list.</div>';
  studentList = r.body.students; meOwner = !!(r.body.me && r.body.me.owner);
  const n = (f) => studentList.filter(f).length, chip = (k, l) => '<button class="ad-chip" type="button" data-sf="' + k + '" aria-pressed="' + (studFilter === k) + '">' + l + '</button>';
  return '<div class="ad-pagehead"><div><h1 class="ad-title">Students</h1><p class="ad-sub">' + studentList.length + ' accounts. Emails appear once a person has signed in after the email update.' + (meOwner ? '' : ' Only an owner can make or remove admins.') + '</p></div></div>' +
    '<label class="ad-search">' + ic('search') + '<input id="sq" type="search" placeholder="Search name, email or id" aria-label="Search students" value="' + esc(studTerm) + '"></label>' +
    '<div class="ad-chips">' + chip('all', 'All ' + studentList.length) + chip('admins', 'Admins ' + n((s) => s.is_admin || s.owner)) + chip('removed', 'Removed ' + n((s) => s.blocked)) + '</div>' +
    '<div class="ad-card ad-scroll"><table class="ad-t ad-stack"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last exam</th><th class="n">Exams</th><th class="n">Correct</th><th>Role / actions</th></tr></thead><tbody id="sb">' + studentRows() + '</tbody></table>' +
    '<p>Admins can open this page, see student emails, and edit or remove questions and topics. Remove deletes a student\u2019s cloud data and blocks the account from syncing; their login stays in Firebase until you delete it there. To remove an admin account, first remove its admin rights.</p></div>';
}
async function studentAction(uid, action) {
  const s = studentList.find((x) => x.uid === uid), who = esc((s && (s.email || [s.first_name, s.last_name].filter(Boolean).join(' '))) || uid);
  const ask = { remove: ['Remove ' + who + '?', 'Their cloud progress is deleted and the account is blocked from syncing. Their Firebase login stays until you delete it there.', 'Remove', true],
    make_admin: ['Make ' + who + ' an admin?', 'Admins can open this page, see every student\u2019s email, and edit or remove questions and topics.', 'Make admin', false],
    remove_admin: ['Remove admin rights from ' + who + '?', 'They keep their student account.', 'Remove admin', true] }[action];
  if (ask && !(await confirmDialog({ title: ask[0], message: ask[1], ok: ask[2], danger: ask[3] }))) return;
  const r = await adminFetch('/api/admin/student', { method: 'POST', body: JSON.stringify({ uid, action }) });
  if (r.status !== 200) { toast(r.body.message || 'That did not work.', true); return; }
  toast(action === 'unblock' ? 'Account unblocked.' : action === 'remove' ? 'Account removed.' : action === 'make_admin' ? 'Admin rights given.' : 'Admin rights removed.'); show();
}

// ---------- Retention and System ----------
function retention() {
  const a = data.activation, cr = data.cohorts.map((c) => '<tr><td>' + new Date(c.weekStart).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + '</td><td class="n">' + c.size + '</td>' +
    c.retained.map((n) => '<td class="n' + (n == null ? ' ad-low' : '') + '">' + (n == null ? '–' : n + ' (' + pct(n, c.size) + '%)') + '</td>').join('') + '</tr>').join('');
  return '<div class="ad-pagehead"><div><h1 class="ad-title">Retention</h1><p class="ad-sub">Do students come back?</p></div></div><div class="ad-kpis">' +
    kpi('Studied at least once', pct(a.ever, a.signups) == null ? '–' : pct(a.ever, a.signups) + '%', 'of ' + a.signups + ' signups, last 8 weeks') +
    kpi('First exam within 24 h', pct(a.within24h, a.eligible24h) == null ? '–' : pct(a.within24h, a.eligible24h) + '%', 'of signups older than a day') +
    kpi('First exam within 7 days', pct(a.within7d, a.eligible7d) == null ? '–' : pct(a.within7d, a.eligible7d) + '%', 'of signups older than a week') +
    kpi('Median time to first exam', a.medianHours == null ? '–' : a.medianHours + ' h', 'after signing up') + '</div>' +
    '<div class="ad-card ad-scroll"><h2>Weekly signup cohorts: studied again in week…</h2><table class="ad-t"><thead><tr><th>Week of</th><th class="n">Signed up</th><th class="n">Week 0</th><th class="n">Week 1</th><th class="n">Week 2</th><th class="n">Week 3</th></tr></thead><tbody>' +
    (cr || '<tr><td class="ad-low" colspan="6">No signups in the last 8 weeks.</td></tr>') + '</tbody></table><p>"Studied" means finished at least one exam that week. Weeks run Thursday to Wednesday (UTC). With few students, treat single percentages loosely.</p></div>';
}
function system() {
  const t = data.totals, next = new Date(); next.setUTCHours(24, 0, 0, 0);
  const hrs = Math.round((next - Date.now()) / 36e5 * 10) / 10;
  return '<div class="ad-pagehead"><div><h1 class="ad-title">System</h1><p class="ad-sub">Usage and limits</p></div></div><div class="ad-kpis">' + kpi('Users', fmt(t.users)) + kpi('Exams stored', fmt(t.attempts)) + kpi('Topic rows', fmt(t.scopes)) + kpi('Daily limits reset in', hrs + ' h', '00:00 UTC') + '</div>' +
    '<div class="ad-card ad-links"><h2>Live usage (needs your Cloudflare and Firebase login)</h2>' +
    '<a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare: Workers &amp; Pages, Usage</a><a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare: D1, Metrics</a>' +
    '<a href="https://console.firebase.google.com/project/recall-med/authentication/users" target="_blank" rel="noopener">Firebase: Authentication</a>' +
    '<p>Request counts and database reads and writes are not available here, because reading them would need an extra secret. Editing content uses a GitHub token stored only as an encrypted Cloudflare variable. Free-plan reminders: 60 exam uploads per hour per account; D1 allows 100,000 row writes per day.</p></div>';
}
const VIEWS = { overview: async () => overview(), content, students, retention: async () => retention(), system: async () => system() };

// ---------- clicks ----------
async function toggle(btn, body, okMsg) {
  btn.disabled = true;
  try { await cfgPost(body); toast(okMsg); } catch (e) { toast(e.message, true); }
  show();
}
const STUDENT_BTN = '[data-rm],[data-ub],[data-mk],[data-rma]';
document.addEventListener('click', async (e) => {
  if (!root.contains(e.target)) return;
  const tg = e.target.closest('[data-sw]');
  if (tg) {
    const k = tg.dataset.sw, on = tg.getAttribute('aria-checked') !== 'true';   // the state it is switching TO
    if (k === 'mod-ongoing') return toggle(tg, { action: 'set_module', moduleId: tg.dataset.m, ongoing: on }, on ? 'Now the ongoing module.' : 'No longer the ongoing module.');
    if (k === 'mod-visible') {
      if (!on && !(await confirmDialog({ title: 'Hide this module from students?', message: 'Students will no longer see ' + esc(tg.dataset.m) + ' or any of its topics. Admins still see it, with a Hidden badge.', ok: 'Hide module', danger: true }))) return;
      return toggle(tg, { action: 'set_module', moduleId: tg.dataset.m, hidden: !on }, on ? 'Module visible to students in about a minute.' : 'Module hidden from students in about a minute.');
    }
    if (k === 'topic') { const t = topicByKey(tg.dataset.tk); if (t) return toggle(tg, { action: 'set_topic', moduleId: t.module, exam: t.exam, subject: t.subject, topicId: t.sub, hidden: !on }, on ? 'Topic visible to students in about a minute.' : 'Topic hidden from students in about a minute.'); }
    return;
  }
  const b = e.target.closest('[data-act],[data-add],[data-sf],' + STUDENT_BTN);
  if (b) {
    const d = b.dataset;
    if (d.act === 'edit') return openEditor(d.key);
    if (d.act === 'del') return removeQuestion(d.key);
    if (d.add) return openEditor(null, d.add);
    if (d.act === 'tdetails') return openTopicEditor(topicByKey(d.tk));
    if (d.act === 'newtopic') return openTopicEditor(null, d.sk);
    if (d.act === 'publish') { const t = topicByKey(d.tk); if (t) return toggle(b, { action: 'set_topic', moduleId: t.module, exam: t.exam, subject: t.subject, topicId: t.sub, hidden: false }, 'Topic visible to students in about a minute.'); }
    if (d.sf) { studFilter = d.sf; document.querySelectorAll('[data-sf]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.sf === studFilter)); $('sb').innerHTML = studentRows(); return; }
    const uid = d.rm || d.ub || d.mk || d.rma;
    if (uid) return studentAction(uid, d.rm ? 'remove' : d.ub ? 'unblock' : d.mk ? 'make_admin' : 'remove_admin');
  }
  const go = e.target.closest('[data-go]'); if (go && !e.target.closest('button,a')) location.hash = go.dataset.go;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-go]')) location.hash = e.target.dataset.go; });
document.addEventListener('input', (e) => { if (e.target.id === 'sq' && $('sb')) { studTerm = e.target.value; $('sb').innerHTML = studentRows(); } });
</script>
</body>
