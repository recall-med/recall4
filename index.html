<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ============================================================
    Recall — index.html
    ============================================================
    HOW TO CHANGE SITE TITLE: Edit the <title> tag below AND
    update "siteTitle" in config/modules.json.

    HOW TO CHANGE FAVICON: Replace assets/images/icon.png (header mark,
    light theme) and icon-dark.png (header mark, dark theme; both are
    192x192 so they stay sharp on high-density and zoomed screens, and are
    losslessly compressed, e.g. with oxipng, to keep them small), then
    regenerate favicon*.png / apple-touch-icon.png from it. Favicons
    are the logo on its navy background, cropped in a little, with rounded
    corners. apple-touch-icon.png is left square on purpose: iOS rounds it
    itself, and transparent corners would turn black.

    HOW TO CHANGE COLORS: Edit assets/css/styles.css :root {}

    DEPLOYMENT: Push to GitHub and enable GitHub Pages on the
    main branch. No build step required.
    ============================================================
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO & Social -->
  <title>Recall</title>
  <meta name="description" content="Professional medical question bank for anatomy, physiology, biochemistry, and histology." />
  <meta name="theme-color" content="#1B3A6B" />

  <!-- Open Graph -->
  <meta property="og:title"       content="Recall" />
  <meta property="og:description" content="Professional medical question bank platform." />
  <meta property="og:type"        content="website" />

  <!-- Favicon -->
  <!-- Favicon: navy mark with a thin white outline so it stays visible on light and dark browser tabs -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/images/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />

  <!-- Theme: apply before render to prevent flash -->
  <script>
    (function() {
      var t = localStorage.getItem('dqb_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Preconnect for fonts, then load them alongside the stylesheet (not chained behind it) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=DM+Mono:wght@400;500&family=DM+Serif+Display&display=swap" />

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/account.css" />
</head>
<body>

  <!--
    ┌─────────────────────────────────────────────────────┐
    │  Site Header — persistent, sits outside #app so it   │
    │  survives every route change. Clicks are handled by  │
    │  App's global [data-nav] / #theme-toggle delegation. │
    └─────────────────────────────────────────────────────┘
  -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" data-nav="dashboard" data-params="{}" aria-label="Recall — Dashboard">
        <img src="assets/images/icon.png" alt="" class="site-header__mark site-header__mark--light" width="36" height="36" fetchpriority="high" />
        <img src="assets/images/icon-dark.png" alt="" class="site-header__mark site-header__mark--dark" width="36" height="36" fetchpriority="high" />
        <span class="site-header__wordmark">
          <span class="site-header__title">Recall</span>
          <span class="site-header__tagline">ZNU · MEDICINE</span>
        </span>
      </a>
      <div class="site-header__actions">
        <button class="btn btn--ghost btn--sm account-signin" id="signin-btn" type="button" aria-haspopup="dialog" hidden>Sign in</button>
        <button class="icon-btn account-btn" id="account-btn" type="button" title="Account" aria-label="Account" aria-haspopup="dialog" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <button class="icon-btn icon-btn--danger" id="wipe-history-btn" title="Reset Progress" aria-label="Reset Progress">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
        <button class="icon-btn theme-toggle" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg class="icon theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg class="icon theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Wipe History Modal — lives here (outside #app) so Reset Progress works from any page -->
  <div id="wipe-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-divider"></div>
      <h2 class="modal-title">Reset Progress?</h2>
      <p class="modal-body">This will permanently delete all exam scores, progress, and incorrect question history.</p>
      <p class="modal-note">Your flagged questions will not be affected.</p>
      <div class="modal-actions">
        <button class="btn btn--ghost" id="wipe-cancel-btn">Cancel</button>
        <button class="btn btn--danger" id="wipe-confirm-btn">Reset Progress</button>
      </div>
    </div>
  </div>

  <!-- Account modal — sign in, create account, account details. Content is filled in by sync.js. -->
  <div id="account-modal" class="modal-overlay" style="display:none">
    <div class="modal-box modal-box--account" role="dialog" aria-modal="true" aria-labelledby="account-title">
      <button class="icon-btn account-close" id="account-close" type="button" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div id="account-view"></div>
    </div>
  </div>

  <!--
    ┌─────────────────────────────────────────────────────┐
    │  Application Root                                   │
    │  All content is injected here by JavaScript.        │
    │  Do not add content inside this div directly.       │
    └─────────────────────────────────────────────────────┘
  -->
  <div id="app" role="main" aria-label="Recall Application">
    <!-- Initial state, shown before JS runs: a dashboard-shaped skeleton (same markup as UI.skeletonDashboard),
         so the first paint already looks like the page and the app simply replaces it. -->
    <div class="dashboard">
      <div class="dashboard__intro">
        <div>
          <span class="skeleton" style="display:block;width:170px;height:28px;border-radius:6px;"></span>
          <div style="margin-top:9px"><span class="skeleton" style="display:block;width:230px;height:13px;border-radius:4px;"></span></div>
        </div>
        <div class="dashboard__quickactions">
          <span class="skeleton" style="display:block;width:38px;height:38px;border-radius:var(--radius);"></span>
          <span class="skeleton" style="display:block;width:38px;height:38px;border-radius:var(--radius);"></span>
        </div>
      </div>
      <aside class="dashboard__rail">
        <div class="dashboard__skel-title" style="margin-bottom:14px"><span class="skeleton" style="display:block;width:64px;height:11px;border-radius:4px;"></span></div>
        <div class="stats-strip"><div class="stat-pill">
        <span class="skeleton" style="display:block;width:44%;height:22px;border-radius:5px;"></span>
        <div style="margin-top:8px"><span class="skeleton" style="display:block;width:70%;height:9px;border-radius:4px;"></span></div>
      </div><div class="stat-pill">
        <span class="skeleton" style="display:block;width:44%;height:22px;border-radius:5px;"></span>
        <div style="margin-top:8px"><span class="skeleton" style="display:block;width:70%;height:9px;border-radius:4px;"></span></div>
      </div><div class="stat-pill">
        <span class="skeleton" style="display:block;width:44%;height:22px;border-radius:5px;"></span>
        <div style="margin-top:8px"><span class="skeleton" style="display:block;width:70%;height:9px;border-radius:4px;"></span></div>
      </div></div>
      </aside>
      <section class="section">
        <div class="dashboard__skel-title" style="margin-bottom:14px"><span class="skeleton" style="display:block;width:76px;height:11px;border-radius:4px;"></span></div>
        <div class="modules-grid"><div class="module-card module-card--hero" style="cursor:default">
        <div class="module-card__header">
          <span class="skeleton" style="display:block;width:32px;height:32px;border-radius:var(--radius-sm);"></span>
          <div class="module-card__meta">
            <span class="skeleton" style="display:block;width:80px;height:16px;border-radius:4px;"></span>
            <div style="margin-top:7px"><span class="skeleton" style="display:block;width:60%;height:11px;border-radius:4px;"></span></div>
            <div style="margin-top:7px"><span class="skeleton" style="display:block;width:35%;height:9px;border-radius:4px;"></span></div>
          </div>
        </div>
        <span class="skeleton" style="display:block;width:100%;height:6px;border-radius:999px;"></span>
        <div class="module-card__row"><span class="skeleton" style="display:block;width:130px;height:30px;border-radius:6px;"></span><span class="skeleton" style="display:block;width:90px;height:16px;border-radius:4px;"></span></div>
      </div><div class="module-card" style="cursor:default">
        <div class="module-card__header">
          <span class="skeleton" style="display:block;width:32px;height:32px;border-radius:var(--radius-sm);"></span>
          <div class="module-card__meta">
            <span class="skeleton" style="display:block;width:80px;height:16px;border-radius:4px;"></span>
            <div style="margin-top:7px"><span class="skeleton" style="display:block;width:60%;height:11px;border-radius:4px;"></span></div>
            <div style="margin-top:7px"><span class="skeleton" style="display:block;width:35%;height:9px;border-radius:4px;"></span></div>
          </div>
        </div>
        <span class="skeleton" style="display:block;width:100%;height:6px;border-radius:999px;"></span>
        <div class="module-card__row"><span class="skeleton" style="display:block;width:130px;height:30px;border-radius:6px;"></span><span class="skeleton" style="display:block;width:90px;height:16px;border-radius:4px;"></span></div>
      </div></div>
      </section>
    </div>
  </div>

  <!--
    ============================================================
    Scripts — loaded in dependency order
    1. storage.js  — LocalStorage persistence layer
    2. exam.js     — Exam engine (question loading, scoring)
    2b. sync.js    — Cloud sync and account interface (inactive until enabled in config/sync-config.json)
    3. ui.js       — UI rendering helpers
    4. ui-skeletons.js — Loading skeletons (adds to UI, so after ui.js)
    5. app.js      — Main application controller (loads last)
    ============================================================
  -->
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/exam.js"></script>
  <script src="assets/js/names.js"></script>
  <script src="assets/js/sync.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/ui-skeletons.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
